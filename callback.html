<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北烬智选 - 授权回调</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f6f7f9;
      color: #1f2937;
    }

    .container {
      max-width: 720px;
      margin: 80px auto;
      padding: 0 24px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 40px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin-top: 0;
      font-size: 30px;
    }

    p {
      line-height: 1.8;
      color: #4b5563;
    }

    pre {
      margin-top: 24px;
      background: #f3f4f6;
      border-radius: 12px;
      padding: 16px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">
      <h1>北烬智选授权回调</h1>

      <p>
        本页面用于开放平台授权回调及个人开发接口联调。
      </p>

      <pre id="result">未检测到回调参数。</pre>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const result = {};

    for (const [key, value] of params.entries()) {
      result[key] = value;
    }

    if (Object.keys(result).length > 0) {
      document.getElementById("result").textContent =
        JSON.stringify(result, null, 2);
    }
  </script>

</body>
</html>
