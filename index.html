<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北烬智选</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f6f7f9;
      color: #1f2937;
    }

    .container {
      max-width: 760px;
      margin: 80px auto;
      padding: 0 24px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 40px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin-top: 0;
      font-size: 34px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 32px;
    }

    .section {
      margin-top: 24px;
    }

    .label {
      font-weight: 600;
      margin-bottom: 6px;
    }

    p {
      line-height: 1.8;
    }

    .notice {
      margin-top: 32px;
      padding: 16px;
      background: #f3f4f6;
      border-radius: 12px;
      color: #4b5563;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>北烬智选</h1>

      <div class="subtitle">
        商品信息整理与选购分析工具
      </div>

      <div class="section">
        <div class="label">项目用途</div>

        <p>
          本项目用于个人开发测试，通过开放平台接口查询可推广商品及店铺公开信息，
          对同型号商品进行规格识别、价格整理和选购分析。
        </p>
      </div>

      <div class="section">
        <div class="label">当前开发阶段</div>

        <p>
          当前处于 Pinduoduo-only 商品比价 MVP 开发和接口联调阶段。
        </p>
      </div>

      <div class="notice">
        本页面仅用于开放平台应用资料展示及开发接口联调。
        本项目不代表任何电商平台官方产品。
      </div>

    </div>
  </div>

</body>
</html>
